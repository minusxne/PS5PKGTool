# Builds the Linux edition as an AppImage.
#
# - Push a tag starting with "v" (for example v1.2.0-linux) to build it and publish a GitHub
#   Release with the AppImage attached. Tags containing a "-" become pre-releases.
# - Or run it by hand from the Actions tab ("Run workflow"): the AppImage is attached to the run as
#   an artifact and nothing is published.
#
# It builds on Ubuntu 22.04 with the official Qt build, so the AppImage runs on distributions from
# about 2022 onward (glibc 2.35+).
name: Linux release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1 libfontconfig1 libdbus-1-3

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          modules: qtmultimedia
          cache: true

      - name: Test the engine
        run: dotnet test PS5PKGTool.Linux.slnx -c Release

      - name: Build the AppImage
        run: ./build-linux.sh --appimage --qt "$QT_ROOT_DIR"

      - name: Name the AppImage after the version
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="$(git rev-parse --short HEAD)"
          file="PS5_PKG_Tool-${version}-x86_64.AppImage"
          mv PS5_PKG_Tool-x86_64.AppImage "$file"
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## PS5 PKG Tool for Linux

            Download the `.AppImage`, make it executable and run it:

            ```sh
            chmod +x PS5_PKG_Tool-*-x86_64.AppImage
            ./PS5_PKG_Tool-*-x86_64.AppImage
            ```

            Works on x86-64 distributions from about 2022 onward (Ubuntu 22.04+, Debian 12+, Fedora 36+,
            Arch, openSUSE Tumbleweed…). Try it without real games with `--demo`.

            **This is not software for obtaining free PS5 games.** Generated images and packages have
            been validated on PC but not on a jailbroken PS5; keep backups.
